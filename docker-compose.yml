services:
  postgres:
    image: postgres:16-alpine
    container_name: fbm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fbm
      POSTGRES_PASSWORD: fbm_dev_password
      POSTGRES_DB: fbm_counter
    ports:
      - '5432:5432'
    volumes:
      - fbm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fbm -d fbm_counter']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local object storage (MinIO). Enable with:
  #   docker compose --profile storage up -d
  # Dev-only defaults — never expose MinIO to the internet with these credentials.
  minio:
    profiles: ['storage']
    image: minio/minio:latest
    container_name: fbm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - fbm_minio_data:/data

volumes:
  fbm_pg_data:
  fbm_minio_data:
